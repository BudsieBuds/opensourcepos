name: Ubuntu Install Script Test

on:
  push:
    branches:
      - master
    paths:
      - 'tools/scripts/install-ubuntu.sh'
      - '.github/workflows/install-script-test.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'tools/scripts/install-ubuntu.sh'
      - '.github/workflows/install-script-test.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  install-test:
    name: Test Install Script (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: default
            db_pass: ''
          - scenario: custom-password
            db_pass: 'TestPass123!'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Make install script executable
        run: chmod +x tools/scripts/install-ubuntu.sh

      - name: Configure PHP 8.2 as default
        run: |
          if command -v update-alternatives >/dev/null 2>&1 && [ -x /usr/bin/php8.2 ]; then
            sudo update-alternatives --set php /usr/bin/php8.2
          fi

      - name: Run install script
        env:
          DB_PASS: ${{ matrix.db_pass }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -o pipefail
          echo "Running install script with scenario: $SCENARIO"
          sudo -E bash tools/scripts/install-ubuntu.sh 2>&1 | tee install-output.log
          echo "Install completed successfully"

      - name: Wait for services to stabilize
        run: sleep 10

      - name: Verify Apache is running
        run: |
          echo "Checking Apache status..."
          sudo systemctl status apache2 --no-pager
          sudo systemctl is-active apache2

      - name: Verify MariaDB is running
        run: |
          echo "Checking MariaDB status..."
          sudo systemctl status mariadb --no-pager
          sudo systemctl is-active mariadb

      - name: Verify Apache HTTP response
        run: |
          echo "Testing HTTP response on port 80..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/)
          echo "HTTP Response Code: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
            echo "Apache is responding correctly"
          elif [ "$HTTP_CODE" = "500" ]; then
            echo "HTTP 500 - Application error. Checking .env configuration..."
            # Never print secret values (password, encryption key) to the log;
            # show only non-secret keys and confirm the sensitive ones are present.
            sudo cat /var/www/ospos/.env 2>/dev/null | grep -E "database\.default\.(hostname|database|username)|CI_ENVIRONMENT" | head -10
            sudo grep -q '^encryption\.key=.' /var/www/ospos/.env 2>/dev/null && echo "encryption.key is set" || echo "WARNING: encryption.key is NOT set"
            sudo cat /var/www/ospos/writable/logs/*.log 2>/dev/null | tail -20 || true
            curl -s -L http://localhost/ | head -50
            exit 1
          else
            echo "Unexpected HTTP code: $HTTP_CODE"
            exit 1
          fi

      - name: Verify PHP version
        run: |
          echo "Verifying CLI PHP version..."
          CLI_PHP=$(php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')
          echo "CLI PHP Version: $CLI_PHP"
          if [ "$CLI_PHP" != "8.2" ]; then
            echo "::error::Expected CLI PHP 8.2, found $CLI_PHP"
            exit 1
          fi

          echo "Verifying Apache PHP module version..."
          sudo bash -c 'echo "<?php echo PHP_MAJOR_VERSION . \".\" . PHP_MINOR_VERSION;" > /var/www/ospos/public/phpversion.php'
          APACHE_PHP=$(curl -s http://localhost/phpversion.php)
          sudo rm -f /var/www/ospos/public/phpversion.php
          echo "Apache PHP Version: $APACHE_PHP"
          if [ "$APACHE_PHP" != "8.2" ]; then
            echo "::error::Expected Apache PHP 8.2, found $APACHE_PHP"
            exit 1
          fi

      - name: Verify OSPOS login page
        run: |
          echo "Checking OSPOS login page..."
          # Follow redirects (-L): the root path may 302 to the login route, so
          # fetch the final page to actually see the login form.
          curl -s -L http://localhost/ | grep -qi "login\|password\|username" && echo "Login page content found" || {
            echo "Login page verification failed"
            curl -s -L http://localhost/ | head -50
            exit 1
          }

      - name: Verify database exists
        env:
          DB_PASS: ${{ matrix.db_pass }}
        run: |
          echo "Verifying database..."
          
          # Extract the generated password from install output if using default.
          # The installer prints "  Password: <value>" (the first such line is the DB
          # password; a later one is the app login password), so anchor on it and take
          # the first match.
          if [ -z "$DB_PASS" ]; then
            GENERATED_PASS=$(grep -oP '^\s*Password: \K[^\s]+' install-output.log | head -n 1 || true)
            if [ -z "$GENERATED_PASS" ] && [ -f /var/www/ospos/.env ]; then
              GENERATED_PASS=$(sudo sed -nE "s/^database\.default\.password=['\"](.*)['\"]/\1/p" /var/www/ospos/.env)
            fi
            if [ -n "$GENERATED_PASS" ]; then
              DB_PASS="$GENERATED_PASS"
            fi
          fi
          
          # Check database exists
          sudo mysql -u root -e "SHOW DATABASES LIKE 'ospos';" | grep -q ospos && echo "Database 'ospos' exists" || {
            echo "Database 'ospos' not found"
            sudo mysql -u root -e "SHOW DATABASES;"
            exit 1
          }
          
          # Check tables exist (use the app account so the scenario actually proves
          # `ospos` can authenticate with the configured DB_PASS, not just root)
          TABLE_COUNT=$(sudo mysql -u ospos -p"$DB_PASS" ospos -e "SHOW TABLES;" | wc -l)
          echo "Found $TABLE_COUNT tables in database"
          if [ "$TABLE_COUNT" -gt 5 ]; then
            echo "Database tables verified"
          else
            echo "Not enough tables found"
            exit 1
          fi

      - name: Upload install log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: install-log-${{ matrix.scenario }}
          path: install-output.log
          retention-days: 7
