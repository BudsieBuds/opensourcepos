name: Build Docker & Release Assets

on:
  push:
    branches:
      - '**'
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.repository == 'opensourcepos/opensourcepos' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)

    outputs:
      version: ${{ steps.version.outputs.version }}
      short-sha: ${{ steps.version.outputs.short-sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.32.0
        with:
          php-version: '8.2'
          extensions: intl, mbstring, mysqli, gd, bcmath, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Get version info
        id: version
        run: |
          VERSION=$(sed -nE "s/.*application_version[[:space:]]*=[[:space:]]*['\"]([^'\"]+)['\"].*/\1/p" app/Config/App.php)
          SHORT_SHA=$(git rev-parse HEAD | cut -c1-6)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short-sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The ZIP below is named from App.php, while the draft-release job
          # globs by the tag name. A manually-pushed tag that does not match
          # App.php would silently produce a draft release with no archive, so
          # fail fast instead.
          if [ "${GITHUB_REF_NAME}" != "$APP_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match App.php version $APP_VERSION"
            exit 1
          fi

      - name: Create .env file
        run: |
          cp .env.example .env
          sed -i 's/production/development/g' .env

      - name: Update commit hash
        env:
          SHORT_SHA: ${{ steps.version.outputs.short-sha }}
        run: |
          sed -i -E "s/commit_sha1[[:space:]]*=[[:space:]]*['\"][^'\"]*['\"]/commit_sha1 = '$SHORT_SHA'/g" app/Config/OSPOS.php

      - name: Build frontend assets
        run: npm run build

      - name: Create distribution archive
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHORT_SHA: ${{ steps.version.outputs.short-sha }}
        run: |
          set -euo pipefail
          npm run gulp -- compress
          mv dist/opensourcepos.zip "dist/opensourcepos.$VERSION.$SHORT_SHA.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          name: dist-${{ steps.version.outputs.short-sha }}
          path: dist/
          retention-days: 7

      - name: Upload build context for Docker
        uses: actions/upload-artifact@v7
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          name: build-context-${{ steps.version.outputs.short-sha }}
          path: |
            .
            !.git/**
            !node_modules/**
            !dist/**
          include-hidden-files: true
          retention-days: 1

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    if: github.repository == 'opensourcepos/opensourcepos' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Download build context
        uses: actions/download-artifact@v8
        with:
          name: build-context-${{ needs.build.outputs.short-sha }}
          path: .

      - name: Set up QEMU
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.0.0

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine Docker tags
        id: tags
        env:
          REGISTRY_USER: ${{ secrets.DOCKER_USERNAME || 'jekkos' }}
          SHA: ${{ needs.build.outputs.short-sha }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          REGISTRY="${REGISTRY_USER}/opensourcepos"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "tags=${REGISTRY}:${VERSION},${REGISTRY}:latest" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/master ]]; then
            echo "tags=${REGISTRY}:master,${REGISTRY}:${SHA}" >> "$GITHUB_OUTPUT"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
            BRANCH="$(printf '%s' "$BRANCH" | LC_ALL=C tr -c 'A-Za-z0-9_.-' '_')"
            BRANCH="${BRANCH:0:$((128 - ${#SHA} - 1))}"
            [[ "$BRANCH" == [-.]* ]] && BRANCH="_${BRANCH:1}"
            echo "tags=${REGISTRY}:${BRANCH}-${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        with:
          context: .
          target: ospos
          platforms: ${{ startsWith(github.ref, 'refs/tags/') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          pull: true
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  unstable-release:
    name: Create Unstable Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.build.outputs.short-sha }}
          path: dist/

      - name: Delete previous unstable release and tag
        run: |
          if gh release view unstable >/dev/null 2>&1; then
            gh release delete unstable --yes --cleanup-tag
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Create/Update unstable release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.0
        with:
          tag_name: unstable
          target_commitish: ${{ github.sha }}
          name: Unstable OpenSourcePOS
          body: |
            This is a build of the latest master which might contain bugs. Use at your own risk.

            Check the releases section for the latest official release.
          files: |
            dist/opensourcepos.${{ needs.build.outputs.version }}.${{ needs.build.outputs.short-sha }}.zip
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  official-release:
    name: Create Official Release (Draft)
    needs: [build, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.build.outputs.short-sha }}
          path: dist/

      - name: Build release notes
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME || 'jekkos' }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          # Extract this version's changelog section (header + entries) from CHANGELOG.md.
          SECTION=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\] - " {insec=1; print; next}
            insec && $0 ~ "^## \\[" {insec=0; next}
            insec {print}
          ' CHANGELOG.md)
          if [ -z "$SECTION" ]; then
            echo "WARNING: no changelog section found for $VERSION"
            SECTION="Changelog section for ${VERSION} is not present in CHANGELOG.md."
          fi
          {
            echo "## Upgrade instructions"
            echo ""
            echo "**Docker:**"
            echo ""
            echo '```bash'
            echo "docker pull ${DOCKER_USER}/opensourcepos:${VERSION}"
            echo "docker compose -f docker-compose.nginx.yml up -d"
            echo '```'
            echo ""
            echo "**Existing installation:** download the archive below, extract it over your current install, and run any new database migrations."
            echo ""
            echo "---"
            echo ""
            printf '%s\n' "$SECTION"
          } > /tmp/release_notes.md
          echo "=== release notes (first 12 lines) ==="
          head -12 /tmp/release_notes.md

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          MAX_ATTEMPTS=3
          ATTEMPT=1
          IS_DRAFT=""
          IS_ABSENT=false

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "Checking existing release status for tag '$TAG' (attempt $ATTEMPT/$MAX_ATTEMPTS)..."
            ERR_FILE=$(mktemp)
            OUT_FILE=$(mktemp)

            if gh release view "$TAG" --json isDraft >"$OUT_FILE" 2>"$ERR_FILE"; then
              IS_DRAFT=$(jq -r '.isDraft // empty' "$OUT_FILE" 2>/dev/null || grep -o '"isDraft":\s*[^,}]*' "$OUT_FILE" | cut -d: -f2 | tr -d ' "')
              rm -f "$OUT_FILE" "$ERR_FILE"
              break
            else
              ERR_MSG=$(cat "$ERR_FILE")
              rm -f "$OUT_FILE" "$ERR_FILE"
              if [[ "$ERR_MSG" =~ "release not found" ]] || [[ "$ERR_MSG" =~ "404" ]]; then
                IS_ABSENT=true
                break
              fi
              echo "Lookup failed with unexpected error: $ERR_MSG"
              if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
                sleep $((ATTEMPT * 2))
              fi
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done

          ZIP=$(ls dist/opensourcepos."${TAG}".*.zip 2>/dev/null | head -1 || true)
          ASSET_ARGS=()
          if [ -n "$ZIP" ]; then
            ASSET_ARGS=("$ZIP")
          fi

          if [ "$IS_ABSENT" = true ]; then
            echo "Confirmed no existing release for tag '$TAG'. Creating draft release..."
            gh release create "$TAG" "${ASSET_ARGS[@]}" \
              --draft \
              --title "OpenSourcePOS $TAG" \
              --notes-file /tmp/release_notes.md
          elif [ "$IS_DRAFT" = "true" ]; then
            echo "Confirmed release for tag '$TAG' is a draft. Updating draft release..."
            gh release edit "$TAG" \
              --draft \
              --title "OpenSourcePOS $TAG" \
              --notes-file /tmp/release_notes.md
            if [ -n "$ZIP" ]; then
              gh release upload "$TAG" "$ZIP" --clobber
            fi
          elif [ "$IS_DRAFT" = "false" ]; then
            echo "::error::Release for tag '$TAG' is already published. Refusing to overwrite a published release."
            exit 1
          else
            echo "::error::Could not determine release status for tag '$TAG' after $MAX_ATTEMPTS attempts."
            exit 1
          fi
